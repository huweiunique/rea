name: Mirror upstream prebuilt package

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
  push:
    branches: [mirror-upstream-bootstrap]
    paths: [.github/workflows/mirror-upstream-release.yml]

permissions:
  contents: write

concurrency:
  group: mirror-upstream-prebuilt-package
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'huweiunique/rea'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Copy and verify the original upstream npm tarball
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          import re
          import tarfile
          import urllib.error
          import urllib.parse
          import urllib.request
          
          UPSTREAM = 'morluto/rea'
          DESTINATION = 'huweiunique/rea'
          PACKAGE = 'rea-agents'
          MARKER = '<!-- upstream-npm-mirror: morluto/rea -->'
          MAX_BYTES = 256 * 1024 * 1024
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError('Unexpected redirect; refusing to forward credentials')
          
          opener = urllib.request.build_opener(NoRedirect)
          
          def request(url, method='GET', data=None, authenticated=False, binary=False):
              headers = {'User-Agent': 'rea-upstream-package-mirror', 'Accept': 'application/octet-stream' if binary else 'application/json'}
              host = urllib.parse.urlsplit(url)
              if host.scheme != 'https' or host.username or host.password:
                  raise RuntimeError('Invalid HTTPS destination')
              if authenticated:
                  if host.netloc not in ('api.github.com', 'uploads.github.com'):
                      raise RuntimeError('Refusing credentials to non-GitHub API')
                  headers['Accept'] = 'application/vnd.github+json'
                  headers['Authorization'] = 'Bearer ' + os.environ['GH_TOKEN']
                  headers['X-GitHub-Api-Version'] = '2022-11-28'
              if data is not None:
                  headers['Content-Type'] = 'application/octet-stream' if binary else 'application/json'
                  if not binary:
                      data = json.dumps(data).encode()
              with opener.open(urllib.request.Request(url, headers=headers, method=method, data=data), timeout=120) as response:
                  raw = response.read(MAX_BYTES + 1)
                  if len(raw) > MAX_BYTES:
                      raise RuntimeError('Response exceeds safe size limit')
                  return raw if binary else json.loads(raw)
          
          def api(path, method='GET', data=None, missing=False):
              try:
                  return request('https://api.github.com/' + path, method, data, authenticated=True)
              except urllib.error.HTTPError as error:
                  if missing and error.code == 404:
                      return None
                  raise
          
          def package_identity(value, version):
              if value.get('name') != PACKAGE or value.get('version') != version:
                  raise RuntimeError('Package name/version does not match the upstream release')
          
          def main():
              if os.environ.get('GITHUB_REPOSITORY') != DESTINATION:
                  raise RuntimeError('This mirror is restricted to ' + DESTINATION)
              upstream = api('repos/' + UPSTREAM + '/releases/latest')
              if upstream.get('draft') or upstream.get('prerelease'):
                  raise RuntimeError('Only published stable upstream releases may be mirrored')
              tag = upstream['tag_name']
              match = re.fullmatch(r'rea-agents-((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))', tag)
              if not match:
                  raise RuntimeError('Unexpected upstream tag format')
              version = match.group(1)
              upstream_commit = api('repos/' + UPSTREAM + '/commits/' + tag)['sha']
              source = api('repos/' + UPSTREAM + '/contents/package.json?ref=' + upstream_commit)
              package_identity(json.loads(base64.b64decode(source['content'])), version)
              metadata = request('https://registry.npmjs.org/' + PACKAGE + '/' + version)
              package_identity(metadata, version)
              repository = metadata.get('repository', {}).get('url', '')
              if repository not in ('git+https://github.com/morluto/rea.git', 'https://github.com/morluto/rea.git'):
                  raise RuntimeError('Registry metadata points to a different upstream repository')
              filename = PACKAGE + '-' + version + '.tgz'
              tarball_url = 'https://registry.npmjs.org/' + PACKAGE + '/-/' + filename
              dist = metadata['dist']
              if dist.get('tarball') != tarball_url:
                  raise RuntimeError('Registry tarball URL is not the expected official URL')
              package = request(tarball_url, binary=True)
              integrity = 'sha512-' + base64.b64encode(hashlib.sha512(package).digest()).decode()
              if dist.get('integrity') != integrity:
                  raise RuntimeError('Official npm SHA-512 integrity verification failed')
              if dist.get('shasum') != hashlib.sha1(package).hexdigest():
                  raise RuntimeError('Official npm SHA-1 verification failed')
              sha256 = hashlib.sha256(package).hexdigest()
              with tarfile.open(fileobj=io.BytesIO(package), mode='r:gz') as archive:
                  # Inspect only two bounded files; never extract or execute package code.
                  def read_member(name):
                      member = archive.getmember(name)
                      if not member.isfile() or member.size > 1024 * 1024:
                          raise RuntimeError('Invalid package metadata member')
                      return archive.extractfile(member).read()
                  package_identity(json.loads(read_member('package/package.json')), version)
                  license_bytes = read_member('package/LICENSE')
                  if b'MIT License' not in license_bytes or b'morluto' not in license_bytes:
                      raise RuntimeError('Expected upstream license attribution is missing')
              upstream_url = 'https://github.com/' + UPSTREAM + '/releases/tag/' + tag
              body = '\n'.join([
                  MARKER, '# Upstream prebuilt npm package mirror', '',
                  'This attachment is the original package published by morluto, copied byte-for-byte from npm.',
                  'No compilation, repackaging, or npm publishing is performed by this fork.', '',
                  '- Upstream release: ' + upstream_url,
                  '- Upstream source commit: https://github.com/' + UPSTREAM + '/commit/' + upstream_commit,
                  '- Original npm package: https://www.npmjs.com/package/' + PACKAGE + '/v/' + version,
                  '- Original tarball: ' + tarball_url,
                  '- SHA-256: `' + sha256 + '`',
                  '- npm integrity: `' + integrity + '`', '',
                  'The `.tgz` is an npm distribution, not a standalone OS installer. Its upstream LICENSE and notices are preserved unchanged.',
                  'Copyright (c) 2026 morluto. Distributed under the included MIT License.', '',
                  'The fork release tag identifies a fork snapshot. Use the upstream commit link above for the exact package source.',
              ])
              destination_tag = 'mirror-' + tag
              release_path = 'repos/' + DESTINATION + '/releases'
              release = api(release_path + '/tags/' + destination_tag, missing=True)
              if release is None:
                  # Reuse only our interrupted draft, never overwrite another release.
                  for candidate in api(release_path + '?per_page=100'):
                      if candidate['tag_name'] == destination_tag:
                          release = candidate
                          break
              if release is None:
                  release = api(release_path, 'POST', {
                      'tag_name': destination_tag, 'target_commitish': 'main',
                      'name': tag + ' (upstream package mirror)', 'body': body,
                      'draft': True, 'prerelease': False,
                  })
              if MARKER not in (release.get('body') or ''):
                  raise RuntimeError('Existing release is not managed by this mirror; refusing to change it')
              if sha256 not in release['body'] or upstream_commit not in release['body']:
                  raise RuntimeError('Existing mirror provenance differs; refusing to change it')
              assets = api(release_path + '/' + str(release['id']) + '/assets?per_page=100')
              existing = [asset for asset in assets if asset['name'] == filename]
              if len(existing) > 1:
                  raise RuntimeError('Duplicate release asset names')
              if existing:
                  asset = existing[0]
              else:
                  upload = 'https://uploads.github.com/repos/' + DESTINATION + '/releases/' + str(release['id']) + '/assets?name=' + urllib.parse.quote(filename)
                  asset = json.loads(request(upload, 'POST', package, authenticated=True, binary=True))
              if asset.get('state') != 'uploaded' or asset.get('size') != len(package) or asset.get('digest') != 'sha256:' + sha256:
                  raise RuntimeError('Release asset digest/size differs; no asset will be overwritten or deleted')
              if release['draft']:
                  release = api(release_path + '/' + str(release['id']), 'PATCH', {'draft': False, 'make_latest': 'legacy'})
              print(json.dumps({'release': release['html_url'], 'asset': filename, 'bytes': len(package), 'sha256': sha256, 'npm_integrity': integrity, 'upstream_commit': upstream_commit}))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('Verified original upstream package: [' + filename + '](' + release['html_url'] + ')\n\nSHA-256: `' + sha256 + '`\n')
          
          if __name__ == '__main__':
              main()
          PY

# Refresh the original upstream package mirror: 2026-10-14.
