name: Sync upstream

on:
  schedule:
    # Daily at 06:17 China Standard Time (UTC+8).
    - cron: "17 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/sync-upstream.yml]

permissions: {}

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'huweiunique/rea' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Use GitHub's merge API without checking out or executing upstream code.
      # This preserves fork commits and fails on conflicts; never force/reset.
      - name: Sync main from morluto/rea
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
        run: |
          set -euo pipefail
          upstream=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.parent.full_name')
          if [[ "$upstream" != "morluto/rea" ]]; then
            echo "::error::Unexpected upstream; refusing to sync."
            exit 1
          fi

          if gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -f branch=main > "$RUNNER_TEMP/sync-upstream.json"; then
            cat "$RUNNER_TEMP/sync-upstream.json"
            echo "Synced main with morluto/rea, or already up to date." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Upstream sync failed. Review the API error above; no force sync was attempted."
            {
              echo "Upstream sync failed. Existing fork commits were not force-reset."
              echo "Resolve any merge conflict or branch restriction manually, then rerun this workflow."
              echo "If GitHub rejects upstream workflow-file changes, sync those changes manually in GitHub; this workflow uses only the built-in GITHUB_TOKEN."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
